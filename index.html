<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hero Pad">
<meta name="theme-color" content="#7b3fe4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Hero Pad</title>
<script>
  // iOS Safari ignores user-scalable=no, so block pinch zoom by hand.
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
</script>
<link rel="stylesheet" href="css/app.css?v=3">
<script type="module" src="js/app.js?v=3"></script>
</head>
<body>

<main id="home" class="screen">
  <h1>Hero Pad</h1>
  <p class="sub">Pick your hero</p>
  <div id="heroes"></div>
  <div id="input-pick" role="radiogroup" aria-label="Draw with">
    <button data-input="pencil" role="radio">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 31 L11 24 L26 9 L31 14 L16 29 Z M23 12 L28 17" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M9 31 L11 24 L16 29 Z" fill="currentColor"/></svg>
      Pencil
    </button>
    <button data-input="finger" role="radio">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M17 21 V8 a3 3 0 0 1 6 0 V19 M23 18 a3 3 0 0 1 6 0 V24 M17 21 L13.5 17.5 a2.8 2.8 0 0 0 -4 4 L16 30 Q19 34 24 34 Q31 34 31 26 V22 a2.5 2.5 0 0 0 -5 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>
      Finger
    </button>
  </div>
  <button id="go" class="big">GO!</button>
  <p id="ver"></p>
</main>

<main id="play" class="screen" hidden>
  <header class="bar">
    <button id="exit" class="round" aria-label="Hold to go home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 20 L20 9 L32 20 M12 17 V31 H28 V17" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle class="ring" cx="20" cy="20" r="18"/></svg>
    </button>
    <div id="prompt"></div>
    <button id="speak" class="round" aria-label="Say it again">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 16 H13 L21 9 V31 L13 24 H7 Z" fill="currentColor"/><path d="M26 14 Q30 20 26 26 M30 10 Q37 20 30 30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
    </button>
    <div id="stars"></div>
  </header>
  <div id="area">
    <svg id="stage" viewBox="0 0 1000 1000" aria-hidden="true"></svg>
    <canvas id="ink"></canvas>
  </div>
</main>

<main id="done" class="screen" hidden>
  <h1>Mission complete!</h1>
  <svg id="done-svg" viewBox="-60 -60 120 120" aria-hidden="true"><g id="done-hero"></g></svg>
  <div id="done-stars"></div>
  <div class="row">
    <button id="again" class="big">Again!</button>
    <button id="home-btn" class="big quiet">Home</button>
  </div>
</main>

</body>
</html>
